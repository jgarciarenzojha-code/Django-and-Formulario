{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encomiendas</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

<div class="topbar">
    <div><strong>Sistema de Encomiendas</strong></div>

    <div>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'encomienda_lista' %}">Encomiendas</a>
            
            <div class="user-menu" id="userMenu">
                <button class="user-button" id="userButton">👤 {{ user.username }}</button>
                <div class="dropdown-content" id="dropdownContent">
                    <a href="{% url 'perfil' %}">Mi perfil</a>
                    <a href="/admin/" target="_blank">Panel Admin</a>
                    <div class="dropdown-logout">
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit">Cerrar sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>
</div>

<div class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const userMenu = document.getElementById('userMenu');
    const userButton = document.getElementById('userButton');
    const dropdownContent = document.getElementById('dropdownContent');
    
    if (userMenu && userButton && dropdownContent) {
        userButton.addEventListener('click', function(e) {
            e.stopPropagation();
            dropdownContent.classList.toggle('show');
        });
        
        document.addEventListener('click', function(e) {
            if (!userMenu.contains(e.target)) {
                dropdownContent.classList.remove('show');
            }
        });
        
        dropdownContent.addEventListener('click', function(e) {
            if (e.target.tagName === 'A') {
                dropdownContent.classList.remove('show');
            }
        });
    }
});
</script>

</body>
</html>
